# 面向学习助手的受限 DeepSeek Harness 组合配置。
#
# 此配置刻意不是编程 Agent 示例：它不挂载文件系统、Shell、子进程、Web 或通用编辑工具。
# 模型只能调用下方的学习资料库插件；插件通过短时有效、限定对话范围的能力令牌回连 Go 应用。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: disabled
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: 1000000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful learning assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.78
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: learning-library
  name: ./src/learning-library-plugin.mjs
  config:
    bridgeUrlEnv: LEARNING_ASSISTANT_BRIDGE_URL
    tokenEnv: LEARNING_ASSISTANT_HARNESS_TOKEN
    toolPathPrefix: /internal/harness/tools
