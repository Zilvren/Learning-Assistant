# Restricted DeepSeek Harness composition for the learning assistant.
#
# This is intentionally not the coding-agent example: it mounts no filesystem,
# shell, subprocess, web, or generic edit tools. The model can only call the
# learning-library plugin below, which talks back to the Go application through
# a short-lived, conversation-scoped capability token.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: disabled
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: 1000000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a helpful learning assistant.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.78
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

- id: learning-library
  name: ./src/learning-library-plugin.mjs
  config:
    bridgeUrlEnv: LEARNING_ASSISTANT_BRIDGE_URL
    tokenEnv: LEARNING_ASSISTANT_HARNESS_TOKEN
    toolPathPrefix: /internal/harness/tools
