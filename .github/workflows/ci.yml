name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Tracker
        run: go build -o dist/Tracker.exe .

      - name: Build Updater
        run: go build -o dist/Updater.exe ./cmd/updater

  build-production-image:
    name: Build production image
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4

      - name: Build production image
        shell: bash
        run: docker build --tag "learning-assistant:sha-${GITHUB_SHA}" .

      - name: Save production image
        shell: bash
        run: docker save --output "$RUNNER_TEMP/learning-assistant-image.tar" "learning-assistant:sha-${GITHUB_SHA}"

      - name: Upload production image
        uses: actions/upload-artifact@v4
        with:
          name: production-image
          path: ${{ runner.temp }}/learning-assistant-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy to production
    needs: [test-and-build, build-production-image]
    # Never run repository pull-request code on the production server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    concurrency:
      group: learning-assistant-production
      cancel-in-progress: false
    env:
      APP_IMAGE: learning-assistant:sha-${{ github.sha }}

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4

      - name: Download production image
        uses: actions/download-artifact@v4
        with:
          name: production-image
          path: ${{ runner.temp }}/production-image

      - name: Load production image
        shell: bash
        run: docker load --input "$RUNNER_TEMP/production-image/learning-assistant-image.tar"

      - name: Deploy application
        shell: bash
        run: bash "$GITHUB_WORKSPACE/deploy/deploy-from-runner.sh" "$GITHUB_WORKSPACE" "$APP_IMAGE"
