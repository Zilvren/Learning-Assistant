name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build Tracker
        run: go build -o dist/Tracker.exe .

      - name: Build Updater
        run: go build -o dist/Updater.exe ./cmd/updater

  deploy:
    name: Deploy to production
    needs: test-and-build
    # Never run repository pull-request code on the production server.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    concurrency:
      group: learning-assistant-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4

      - name: Deploy application
        shell: bash
        run: bash "$GITHUB_WORKSPACE/deploy/deploy-from-runner.sh" "$GITHUB_WORKSPACE"
